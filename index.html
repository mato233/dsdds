<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodnotenie prevádzky</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-bottom: 10px; font-size: 22px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        
        /* Hviezdičky */
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .star {
            font-size: 40px;
            color: #444;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .star:hover, .star.active {
            color: #FFC107;
            transform: scale(1.15);
        }

        /* Interný formulár pre slabšie hodnotenie (1-3 hviezdy) */
        #feedback-form {
            display: none;
            margin-top: 20px;
            text-align: left;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
        }
        button {
            width: 100%;
            background: #FFC107;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #e0a800; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">Pomôžte nám tvoriť miesto, kam sa budete radi vracať</h2>
    <p id="subtitle">Záleží nám na vašom názore.</p>

    <!-- Zóna hviezdičiek -->
    <div class="stars" id="star-container">
        <span class="star" onclick="rate(1)">★</span>
        <span class="star" onclick="rate(2)">★</span>
        <span class="star" onclick="rate(3)">★</span>
        <span class="star" onclick="rate(4)">★</span>
        <span class="star" onclick="rate(5)">★</span>
    </div>

    <!-- Interný Formsubmit formulár s tvojím e-mailom -->
    <form id="feedback-form" action="https://formsubmit.co/matej23poliak@gmail.com" method="POST">
        <!-- Nastavenia Formsubmitu -->
        <input type="hidden" name="_subject" value="Nová interná sťažnosť z NFC stojana!">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        
        <label style="font-size: 13px; color: #ccc;">Mrzí nás to. Čo môžeme spraviť lepšie?</label>
        <textarea name="sprava" placeholder="Náš tím si váš názor rád prečíta..." required></textarea>
        <button type="submit">Odoslať vedeniu podniku</button>
    </form>
</div>

<script>
    // SEM VLOŽÍŠ GOOGLE LINK REŠTAURÁCIE (Tu je tvoj odkaz pre Bearded Brothers Nitra):
    const GOOGLE_REVIEW_URL = "https://maps.app.goo.gl/k3B7XG8xYJqR7XJCA";

    function rate(stars) {
        if (stars >= 4) {
            // 4 a 5 hviezdičiek -> BLESKOVÝ GOOGLE PRESMER
            window.location.href = GOOGLE_REVIEW_URL;
        } else {
            // 1 až 3 hviezdičky -> OTVORÍ SA INTERNÝ FORMULÁR
            document.getElementById('star-container').style.display = 'none';
            document.getElementById('title').innerText = "Ďakujeme za úprimnosť";
            document.getElementById('subtitle').innerText = "Pomôžte nám napraviť chybu.";
            document.getElementById('feedback-form').style.display = 'block';
        }
    }
</script>

</body>
</html>
