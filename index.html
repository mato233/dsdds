<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Borsalino - Hodnotenie</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #18181b;
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 1px solid #27272a;
        }
        
        /* Logo Pizza Borsalino */
        .logo-container {
            background: #ffffff;
            padding: 10px 16px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .logo {
            width: 120px;
            height: auto;
            max-height: 70px;
            object-fit: contain;
            display: block;
        }

        h2 { 
            font-size: 21px; 
            font-weight: 600; 
            margin-bottom: 8px; 
            line-height: 1.3;
            letter-spacing: -0.2px;
        }
        .subtitle { 
            color: #a1a1aa; 
            font-size: 14px; 
            margin-bottom: 24px; 
            line-height: 1.4;
        }
        
        /* Google Hviezdičky */
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .star {
            font-size: 44px;
            color: #3f3f46;
            cursor: pointer;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .star:active { transform: scale(1.2); }

        /* Formulár pre 1-3 hviezdy */
        #feedback-form {
            display: none;
            margin-top: 18px;
            text-align: left;
        }
        .input-label {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 6px;
            display: block;
            margin-top: 14px;
        }
        textarea, input[type="email"] {
            width: 100%;
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            height: 90px;
            resize: none;
            margin-bottom: 4px;
        }
        input[type="email"] {
            margin-bottom: 20px;
        }
        textarea:focus, input[type="email"]:focus {
            outline: none;
            border-color: #D32F2F;
        }
        button {
            width: 100%;
            background: #D32F2F;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:active { background: #B71C1C; }
    </style>
</head>
<body>

<div class="card">
    <!-- LOGO PIZZERIE -->
    <div class="logo-container" id="logo-box">
        <img src="logo.png" alt="Pizza Borsalino" class="logo" onerror="document.getElementById('logo-box').style.display='none'">
    </div>

    <!-- HLAVNÁ OBRAZOVKA -->
    <div id="main-screen">
        <h2 id="title">Pomôžte nám tvoriť miesto, kam sa budete radi vracať</h2>
        <p class="subtitle" id="subtitle">Každé hodnotenie si osobne čítame.</p>

        <!-- Hviezdičky -->
        <div class="stars" id="star-container">
            <span class="star" onclick="rate(1)">★</span>
            <span class="star" onclick="rate(2)">★</span>
            <span class="star" onclick="rate(3)">★</span>
            <span class="star" onclick="rate(4)">★</span>
            <span class="star" onclick="rate(5)">★</span>
        </div>

        <!-- Klasický FormSubmit formulár s nastaviteľným _next presmerovaním -->
        <form id="feedback-form" action="https://formsubmit.co/matej23poliak@gmail.com" method="POST">
            <!-- FormSubmit nastavenia -->
            <input type="hidden" name="_subject" value="Nová sťažnosť z NFC stojana - Pizza Borsalino!">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            
            <!-- TU NASTAVUJEŠ PRESMEROVANIE PODĽA TOHO NÁVODU -->
            <input type="hidden" name="_next" value="https://mato233.github.io/?status=success">

            <textarea name="sprava" placeholder="Čo môžeme do budúcna spraviť lepšie?" required></textarea>
            
            <label class="input-label">Chcete, aby sme vám na správu odpovedali?</label>
            <input type="email" name="email" placeholder="Zanechajte váš e-mail (voliteľné)">
            
            <button type="submit">Odoslať majiteľovi</button>
        </form>
    </div>
</div>

<script>
    const GOOGLE_REVIEW_URL = "https://maps.app.goo.gl/k3B7XG8xYJqR7XJCA";

    function rate(stars) {
        if (stars >= 4) {
            // 4 a 5 hviezdičiek -> Presmerovanie na Google
            window.location.replace(GOOGLE_REVIEW_URL);
        } else {
            // 1 až 3 hviezdičky -> Otvorenie formulára
            document.getElementById('star-container').style.display = 'none';
            document.getElementById('title').innerText = "Chceme to napraviť";
            document.getElementById('subtitle').style.display = 'none';
            document.getElementById('feedback-form').style.display = 'block';
        }
    }
</script>

</body>
</html>
