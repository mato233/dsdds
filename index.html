<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Borsalino - Hodnotenie</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 28px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 2px solid #008c45; /* Talianska zelená na okraj karty */
        }
        
        /* Logo Pizza Borsalino */
        .logo-container {
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 18px;
            border: 2px solid #e50914; /* Červený akcent okolo bieleho loga */
            box-shadow: 0 4px 12px rgba(0, 140, 69, 0.3);
        }
        .logo {
            width: 130px;
            height: auto;
            max-height: 75px;
            object-fit: contain;
            display: block;
        }

        h2 { 
            font-size: 20px; 
            font-weight: 600; 
            margin-bottom: 8px; 
            line-height: 1.3;
        }
        .subtitle { 
            color: #aaa; 
            font-size: 13.5px; 
            margin-bottom: 22px; 
            line-height: 1.4;
        }
        
        /* Hviezdičky */
        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .star {
            font-size: 42px;
            color: #333;
            cursor: pointer;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .star:active { transform: scale(1.25); }

        /* Formulár pre 1-3 hviezdy */
        #feedback-form {
            display: none;
            margin-top: 15px;
            text-align: left;
        }
        .input-label {
            font-size: 12.5px;
            color: #008c45; /* Zelený nadpis pre emailové políčko */
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
            margin-top: 12px;
        }
        textarea {
            width: 100%;
            height: 85px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            resize: none;
            font-size: 14px;
            margin-bottom: 5px;
            font-family: inherit;
        }
        input[type="email"] {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #008c45; /* Zelené ohraničenie e-mailu */
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 18px;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #e50914;
        }
        input[type="email"]:focus {
            outline: none;
            border-color: #2e7d32;
        }
        button {
            width: 100%;
            background: #e50914; /* Talianska červená pre hlavné tlačidlo */
            color: #ffffff;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        button:hover { background: #b80710; }

        /* Poďakovacia obrazovka (Thank You Screen) */
        #thank-you-screen {
            display: none;
            padding: 10px 0;
        }
        .heart-icon {
            font-size: 45px;
            margin-bottom: 10px;
            color: #008c45; /* Zelený akcent */
        }
    </style>
</head>
<body>

<div class="card">
    <!-- LOGO PIZZERIE -->
    <div class="logo-container">
        <img src="logo.png" alt="Pizza Borsalino" class="logo">
    </div>

    <!-- HLAVNÁ OBRAZOVKA -->
    <div id="main-screen">
        <h2 id="title">Pomôžte nám tvoriť miesto, kam sa budete radi vracať</h2>
        <p class="subtitle" id="subtitle">Každé hodnotenie si osobne čítame.</p>

        <!-- Hviezdičky -->
        <div class="stars" id="star-container">
            <span class="star" onclick="rate(1)">★</span>
            <span class="star" onclick="rate(2)">★</span>
            <span class="star" onclick="rate(3)">★</span>
            <span class="star" onclick="rate(4)">★</span>
            <span class="star" onclick="rate(5)">★</span>
        </div>

        <!-- Formulár po kliknutí na 1-3 hviezdy -->
        <form id="feedback-form" action="https://formsubmit.co/matej23poliak@gmail.com" method="POST" onsubmit="handleFormSubmit(event)">
            <input type="hidden" name="_subject" value="Nová sťažnosť z NFC stojana - Pizza Borsalino!">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            
            <textarea name="sprava" placeholder="Čo môžeme do budúcna spraviť lepšie?" required></textarea>
            
            <label class="input-label">Chcete, aby sme vám na správu odpovedali?</label>
            <input type="email" name="email" placeholder="Zanechajte váš e-mail (voliteľné)">
            
            <button type="submit">Odoslať majiteľovi</button>
        </form>
    </div>

    <!-- POĎAKOVACIA OBRAZOVKA (THANK YOU SCREEN) -->
    <div id="thank-you-screen">
        <div class="heart-icon">🍕</div>
        <h2>Ďakujeme za vašu úprimnosť</h2>
        <p class="subtitle" style="margin-top: 10px; margin-bottom: 0;">Urobíme všetko pre to, aby ste sa u nás nabudúce cítili lepšie.</p>
    </div>
</div>

<script>
    const GOOGLE_REVIEW_URL = "https://maps.app.goo.gl/k3B7XG8xYJqR7XJCA";

    function rate(stars) {
        if (stars >= 4) {
            // 4 a 5 hviezdičiek -> Bleskový presmer pre mobily
            window.location.replace(GOOGLE_REVIEW_URL);
        } else {
            // 1 až 3 hviezdičky -> Osobný, čistý formulár
            document.getElementById('star-container').style.display = 'none';
            document.getElementById('title').innerText = "Chceme to napraviť";
            document.getElementById('subtitle').style.display = 'none';
            document.getElementById('feedback-form').style.display = 'block';
        }
    }

    function handleFormSubmit(event) {
        // Po odoslaní plynulo prepne na vlastnú Thank You obrazovku
        setTimeout(() => {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('thank-you-screen').style.display = 'block';
        }, 300);
    }
</script>

</body>
</html>
