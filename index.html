<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Borsalino - Hodnotenie</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #18181b;
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 1px solid #27272a;
        }
        
        /* Zväčšené logo na dvojnásobok */
        .logo-container {
            display: inline-block;
            margin-bottom: 16px;
            width: 100%;
        }
        .logo {
            width: 280px; /* Dvojnásobná veľkosť */
            height: auto;
            max-height: 180px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        h2 { 
            font-size: 21px; 
            font-weight: 600; 
            margin-bottom: 8px; 
            line-height: 1.3;
            letter-spacing: -0.2px;
        }
        .subtitle { 
            color: #a1a1aa; 
            font-size: 14px; 
            margin-bottom: 24px; 
            line-height: 1.4;
        }
        
        /* Hviezdičky - v základe sivé */
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            direction: ltr;
        }
        .star {
            font-size: 44px;
            color: #3f3f46; /* Tmavá sivá v základe */
            cursor: pointer;
            transition: transform 0.15s, color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .star:active { transform: scale(1.25); }
        
        /* Zlatá farba pre ozlátené hviezdičky */
        .star.active {
            color: #FFC107;
        }

        /* Formulár pre 1-3 hviezdy */
        #feedback-form {
            display: none;
            margin-top: 18px;
            text-align: left;
        }
        .input-label {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 6px;
            display: block;
            margin-top: 14px;
        }
        textarea, input[type="email"] {
            width: 100%;
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            height: 90px;
            resize: none;
            margin-bottom: 4px;
        }
        input[type="email"] {
            margin-bottom: 20px;
        }
        textarea:focus, input[type="email"]:focus {
            outline: none;
            border-color: #D32F2F;
        }
        button {
            width: 100%;
            background: #D32F2F;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:active { transform: scale(0.98); background: #B71C1C; }

        /* Poďakovacia obrazovka */
        #thank-you-screen {
            display: none;
            padding: 15px 0;
        }
        .pizza-icon {
            font-size: 50px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- LOGO PIZZERIE -->
    <div class="logo-container" id="logo-box">
        <img src="logo.png" alt="Pizza Borsalino" class="logo" onerror="document.getElementById('logo-box').style.display='none'">
    </div>

    <!-- HLAVNÁ OBRAZOVKA -->
    <div id="main-screen">
        <h2 id="title">Pomôžte nám tvoriť miesto, kam sa budete radi vracať</h2>
        <p class="subtitle" id="subtitle">Každé hodnotenie si osobne čítame.</p>

        <!-- Hviezdičky -->
        <div class="stars" id="star-container">
            <span class="star" data-value="1" onclick="rate(1)">★</span>
            <span class="star" data-value="2" onclick="rate(2)">★</span>
            <span class="star" data-value="3" onclick="rate(3)">★</span>
            <span class="star" data-value="4" onclick="rate(4)">★</span>
            <span class="star" data-value="5" onclick="rate(5)">★</span>
        </div>

        <!-- Formulár po kliknutí 1-3 hviezdy -->
        <form id="feedback-form" onsubmit="sendFeedback(event)">
            <textarea id="sprava" name="sprava" placeholder="Čo môžeme do budúcna spraviť lepšie?" required></textarea>
            
            <label class="input-label">Chcete, aby sme vám na správu odpovedali?</label>
            <input type="email" id="email" name="email" placeholder="Zanechajte váš e-mail (voliteľné)">
            
            <button type="submit" id="submit-btn">Odoslať majiteľovi</button>
        </form>
    </div>

    <!-- POĎAKOVACIA OBRAZOVKA -->
    <div id="thank-you-screen">
        <div class="pizza-icon">🍕</div>
        <h2>Ďakujeme za vašu úprimnosť</h2>
        <p class="subtitle" style="margin-top: 10px; margin-bottom: 0;">Urobíme všetko pre to, aby ste sa u nás nabudúce cítili lepšie.</p>
    </div>
</div>

<script>
    const GOOGLE_REVIEW_URL = "https://maps.app.goo.gl/k3B7XG8xYJqR7XJCA";

    function rate(stars) {
        // 1. Zafarbí hviezdičky na zlato podľa kliknutého počtu
        const allStars = document.querySelectorAll('.star');
        allStars.forEach((star, index) => {
            if (index < stars) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });

        // 2. Malý delay (400 ms), aby zákazník stihol vidieť zlaté hviezdičky
        setTimeout(() => {
            if (stars >= 4) {
                window.location.replace(GOOGLE_REVIEW_URL);
            } else {
                document.getElementById('star-container').style.display = 'none';
                document.getElementById('title').innerText = "Chceme to napraviť";
                document.getElementById('subtitle').style.display = 'none';
                document.getElementById('feedback-form').style.display = 'block';
            }
        }, 400);
    }

    function sendFeedback(event) {
        event.preventDefault();

        const btn = document.getElementById('submit-btn');
        btn.innerText = "Odosielam...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append('sprava', document.getElementById('sprava').value);
        formData.append('email', document.getElementById('email').value);
        formData.append('_subject', 'Nová sťažnosť z NFC stojana - Pizza Borsalino!');
        formData.append('_template', 'table');
        formData.append('_captcha', 'false');

        fetch("https://formsubmit.co/ajax/matej23poliak@gmail.com", {
            method: "POST",
            body: formData
        })
        .then(() => {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('thank-you-screen').style.display = 'block';
        })
        .catch(() => {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('thank-you-screen').style.display = 'block';
        });
    }
</script>

</body>
</html>
